version: '3.8'

services:
  # ─── Web Application (FastAPI + Agent + UI + Pre-indexed DB) ───────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinisource_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DAILY_REQUEST_LIMIT=${DAILY_REQUEST_LIMIT:-50}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Uncomment to use PostgreSQL container instead of local SQLite:
      # - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/clinisource
    # depends_on:
    #   - postgres

  # ─── Optional PostgreSQL + pgvector (for multi-node production) ───────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinisource_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinisource
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ingestion/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
